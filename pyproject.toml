[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "duplicate-file-preventer"
description = "Monitors folders for duplicate files created by Thunderbird's FiltaQuilla extension and quarantines them before they sync to cloud storage."
readme = "README.md"
license = {text = "GPL-3.0"}
authors = [
    {name = "RedBearAK"}
]
keywords = ["thunderbird", "duplicates", "filtaquilla", "cloud-sync", "file-monitoring"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Environment :: MacOS X",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Desktop Environment :: File Managers",
    "Topic :: System :: Filesystems",
    "Topic :: Utilities",
]
# Floor set by watchdog: 4.x dropped 3.8, 6.x needs 3.9. rich is fine lower.
requires-python = ">=3.9"
# Version lives in src/duplicate_preventer/_version.py; dependencies live in
# requirements.txt. Both are read dynamically so nothing here can drift.
dynamic = ["version", "dependencies"]

[project.urls]
Homepage = "https://github.com/RedBearAK/Duplicate-File-Preventer"
Repository = "https://github.com/RedBearAK/Duplicate-File-Preventer"
Issues = "https://github.com/RedBearAK/Duplicate-File-Preventer/issues"

[project.scripts]
duplicate-preventer = "duplicate_preventer.__main__:main"

[project.optional-dependencies]
# macOS menu bar front end. rumps pulls in PyObjC; the marker keeps it off
# Linux/Windows entirely:  pip install '.[menubar]'
menubar = ["rumps>=0.4 ; sys_platform == 'darwin'"]
dev = [
    "pytest>=7.0.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["duplicate_preventer*"]

[tool.setuptools.dynamic]
version = {attr = "duplicate_preventer._version.__version__"}
dependencies = {file = ["requirements.txt"]}

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "--tb=short"
filterwarnings = [
    "ignore:Test functions should return None",
    "ignore::pytest.PytestReturnNotNoneWarning",
]
